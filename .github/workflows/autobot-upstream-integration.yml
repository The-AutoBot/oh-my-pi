name: Run isolated AutoBot installer diagnostic

on:
   workflow_dispatch:
      inputs:
         candidate_sha:
            description: "Lowercase 40-character candidate commit ID to diagnose"
            required: true
            type: string

permissions:
   contents: read

jobs:
   installer-diagnostic:
      name: Build candidate native addon and run installer suite
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - name: Require the isolated operator branch and an immutable candidate ID
           shell: bash
           env:
              EXPECTED_REPOSITORY: The-AutoBot/oh-my-pi
              EXPECTED_BRANCH: autobot/installer-diagnostic
              CANDIDATE_SHA: ${{ inputs.candidate_sha }}
           run: |
              set -euo pipefail
              if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
                echo "::error::This diagnostic is restricted to $EXPECTED_REPOSITORY" >&2
                exit 1
              fi
              if [[ "$GITHUB_REF" != "refs/heads/$EXPECTED_BRANCH" ]]; then
                echo "::error::Dispatch this diagnostic only from $EXPECTED_BRANCH" >&2
                exit 1
              fi
              if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::candidate_sha must be a lowercase 40-character Git commit ID" >&2
                exit 1
              fi

         - name: Checkout the isolated diagnostic definitions without credentials
           uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ github.sha }}
              fetch-depth: 1
              persist-credentials: false

         - name: Provision native build system dependencies
           uses: ./.github/actions/setup-system-deps

         - name: Provision pinned compiler Bun
           uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4.0"

         - name: Capture separately provisioned compiler identity
           id: compiler
           shell: bash
           run: |
              set -euo pipefail
              source_bun="$(command -v bun)"
              test "$("$source_bun" -e 'process.stdout.write(`${process.platform}-${process.arch}`)')" = "linux-x64"
              test "$("$source_bun" --version)" = "1.4.0"
              compiler_directory="$RUNNER_TEMP/autobot-installer-diagnostic-toolchain"
              mkdir -p "$compiler_directory"
              compiler_bun="$compiler_directory/$(basename "$source_bun")"
              cp "$source_bun" "$compiler_bun"
              chmod +x "$compiler_bun"
              test "$("$compiler_bun" --version)" = "1.4.0"
              compiler_sha256="$(sha256sum "$compiler_bun" | cut -d ' ' -f1)"
              [[ "$compiler_sha256" =~ ^[0-9a-f]{64}$ ]]
              {
                echo "path=$compiler_bun"
                echo "sha256=$compiler_sha256"
              } >> "$GITHUB_OUTPUT"

         - name: Provision the pinned verification runner Bun
           uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3.14"

         - name: Checkout the exact candidate without persisted credentials
           uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              repository: The-AutoBot/oh-my-pi
              ref: ${{ inputs.candidate_sha }}
              path: candidate
              fetch-depth: 1
              persist-credentials: false

         - name: Freeze dependencies, build the real native addon, and run all installer cases
           shell: bash
           working-directory: candidate
           env:
              CANDIDATE_SHA: ${{ inputs.candidate_sha }}
              GITHUB_TOKEN: ""
              GH_TOKEN: ""
              GIT_TERMINAL_PROMPT: "0"
              AUTOBOT_COMPILER_BUN: ${{ steps.compiler.outputs.path }}
              AUTOBOT_COMPILER_BUN_SHA256: ${{ steps.compiler.outputs.sha256 }}
           run: |
              set -euo pipefail
              test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
              test -z "$(git config --local --get-regexp '^http\..*\.extraheader$' || true)"
              runner_bun="$(command -v bun)"
              test "$("$runner_bun" -e 'process.stdout.write(`${process.platform}-${process.arch}`)')" = "linux-x64"
              test "$("$runner_bun" --version)" = "1.3.14"
              test "$("$AUTOBOT_COMPILER_BUN" --version)" = "1.4.0"
              test "$(sha256sum "$AUTOBOT_COMPILER_BUN" | cut -d ' ' -f1)" = "$AUTOBOT_COMPILER_BUN_SHA256"
              "$runner_bun" install --frozen-lockfile
              "$runner_bun" run build:native
              "$runner_bun" test scripts/autobot-install.test.ts
